<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thông tin cá nhân</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 900px;
      margin: 0 auto;
      border: 1px solid #ddd;
      box-sizing: border-box;
    }

    .fixed-header {
      position: relative;
      flex: 0 0 60px;
      background: white;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 20px;
      box-shadow: 0 2px 5px rgb(0 0 0 / 0.1);
      z-index: 10;
    }

    .fixed-header h1 {
      font-size: 20px;
      color: #007BFF;
      margin: 0;
      text-align: center;
    }

    .back-button {
      position: absolute;
      left: 20px;
      background-color: #007BFF;
      color: white;
      border: none;
      padding: 8px 15px;
      font-size: 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .back-button:hover {
      background-color: #0056b3;
    }

    .content-scroll {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 20px;
    }

    .section {
      margin-bottom: 30px;
    }

    .section h2 {
      color: #007BFF;
      margin-bottom: 10px;
    }

    .card {
      border: 1px solid #ddd;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      background: #f9f9f9;
    }

    p {
      margin: 6px 0;
    }

    @media (max-width: 600px) {
      .fixed-header {
        flex-direction: column;
        align-items: flex-start;
        height: auto;
        padding: 10px;
      }

      .fixed-header h1 {
        max-width: 100%;
        text-align: left;
        margin-left: 50px;
      }

      .back-button {
        position: static;
        margin-bottom: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="fixed-header">
      <button class="back-button" onclick="goBack()">Quay lại</button>
      <h1>Thông tin cá nhân</h1>
    </div>

    <div class="content-scroll">
      <div id="userInfo" class="section"></div>
      <div id="userReviews" class="section"></div>
      <div id="userHistory" class="section"></div>
    </div>
  </div>

  <script>
    function goBack() {
      window.history.back();
    }

    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return parts.pop().split(';').shift();
      return null;
    }

    const username = getCookie("username") || "unknown_user";

    async function fetchUserInfo(username) {
      try {
        const res = await fetch(`/users/${username}/profile`);
        if (!res.ok) throw new Error("Không tìm thấy người dùng");
        const data = await res.json();
        renderUserData(data);
      } catch (err) {
        document.getElementById("userInfo").innerHTML = `<p style="color:red;">${err.message}</p>`;
      }
    }

    function renderUserData(data) {
      const { user, reviews, orders, payments } = data;

      // Thông tin người dùng
      document.getElementById("userInfo").innerHTML = `
        <h2>Thông tin người dùng</h2>
        <div class="card">
          <p><strong>Username:</strong> ${user.username}</p>
          <p><strong>Email:</strong> ${user.email}</p>
          <p><strong>Vai trò:</strong> ${user.role}</p>
          <p><strong>Ngày tạo:</strong> ${new Date(user.created_at).toLocaleString()}</p>
        </div>
      `;

      // Reviews
      const reviewHtml = reviews.length
        ? reviews.map(r => `
          <div class="card">
            <p><strong>Shop ID:</strong> ${r.repair_shop_id}</p>
            <p><strong>Đánh giá:</strong> ${r.rating}</p>
            <p><strong>Bình luận:</strong> ${r.comment || "Không có"}</p>
            <p><strong>Ngày:</strong> ${new Date(r.created_at).toLocaleString()}</p>
          </div>
        `).join("")
        : `<p>Chưa có đánh giá.</p>`;
      document.getElementById("userReviews").innerHTML = `<h2>Đánh giá</h2>${reviewHtml}`;

      // Gộp đơn hàng & thanh toán
      const historyHtml = orders.length
        ? orders.map(order => {
            const payment = payments.find(p => p.order_id === order.id);
            return `
              <div class="card">
                <p><strong>Dịch vụ:</strong> ${order.service.name} - ${order.service.price.toLocaleString()} VND</p>
                <p><strong>Garage:</strong> ${order.repair_shop.name} (${order.repair_shop.phone})</p>
                <p><strong>Ngày đặt:</strong> ${order.order_date ? new Date(order.order_date).toLocaleString() : "-"}</p>
                <p><strong>Trạng thái đơn:</strong> ${order.status}</p>
                ${payment ? `
                  <hr>
                  <p><strong>Thanh toán:</strong></p>
                  <p>- Phương thức: ${payment.payment_method}</p>
                  <p>- Số tiền: ${payment.amount.toLocaleString()} VND</p>
                  <p>- Trạng thái: ${payment.status}</p>
                  <p>- Mã giao dịch: ${payment.transaction_id || "Không có"}</p>
                ` : `<p><em>Chưa thanh toán</em></p>`}
              </div>
            `;
        }).join("")
        : `<p>Chưa có lịch sử đặt dịch vụ.</p>`;
      document.getElementById("userHistory").innerHTML = `<h2>Lịch sử đặt dịch vụ</h2>${historyHtml}`;
    }

    fetchUserInfo(username);
  </script>
</body>
</html>
