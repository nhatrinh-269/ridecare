<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order Management — RideCare</title>
  <link rel="stylesheet" href="../../css/styles.css">
</head>
<body class="full-screen">
  <div class="main-container">
    <h2 class="content">Orders</h2>
    <table id="ordersTable" class="content"></table>
  </div>

  <script src="../../js/auth.js"></script>
  <script src="../../js/repairshop.js"></script>
  <script>
    async function loadOrders() {
      const shops = await fetchShopProfile();
      const shopId = shops[0]?.id;
      const orders = await fetchOrdersForShop(shopId);
      const table = document.getElementById('ordersTable');
      table.innerHTML = '<tr><th>ID</th><th>User ID</th><th>Service ID</th><th>Scheduled</th><th>Status</th></tr>';
      orders.forEach(o => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${o.id}</td>
          <td>${o.user_id}</td>
          <td>${o.service_id}</td>
          <td>${new Date(o.scheduled_date).toLocaleString()}</td>
          <td>${o.status}</td>
        `;
        table.appendChild(row);
      });
    }
    loadOrders();
  </script>
</body>
</html>
