<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Account Management — RideCare Admin</title>
  <link rel="stylesheet" href="../../css/styles.css">
</head>
<body class="full-screen">
  <div class="main-container">
    <h2 class="content">User Accounts</h2>
    <table id="usersTable" class="content"></table>
  </div>

  <script src="../../js/auth.js"></script>
  <script src="../../js/admin.js"></script>
  <script>
    async function loadUsers() {
      const users = await fetchAllUsers();
      const table = document.getElementById('usersTable');
      table.innerHTML = '<tr><th>ID</th><th>Username</th><th>Email</th><th>Action</th></tr>';
      users.forEach(u => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${u.id}</td>
          <td>${u.username}</td>
          <td>${u.email}</td>
          <td><button onclick="deleteUser(${u.id}).then(loadUsers)">Delete</button></td>
        `;
        table.appendChild(row);
      });
    }
    loadUsers();
  </script>
</body>
</html>
