<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Orders - RideCare Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Tailwind gray-100 */
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 50;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
        }
        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 24px;
            border: 1px solid #888;
            width: 80%;
            max-width: 600px;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .close-button {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        .close-button:hover,
        .close-button:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
        .table th, .table td {
            padding: 0.75rem;
            vertical-align: middle;
        }
        .table th {
            background-color: #e5e7eb;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #10b981;
            color: white;
            padding: 1rem;
            border-radius: 0.375rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            z-index: 100;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        .toast.show {
            opacity: 1;
        }
        .toast.error {
            background-color: #ef4444;
        }
        .modal-body-scrollable {
            max-height: 70vh; /* Increased height for more fields */
            overflow-y: auto;
        }
        .status-badge {
            padding: 0.25em 0.6em;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 9999px;
            text-transform: capitalize;
        }
        .status-pending { background-color: #fffbeb; color: #f59e0b; } /* amber-100, amber-500 */
        .status-confirmed { background-color: #eff6ff; color: #3b82f6; } /* blue-100, blue-500 */
        .status-in_progress { background-color: #f0f9ff; color: #0ea5e9; } /* sky-100, sky-500 */
        .status-completed { background-color: #f0fdf4; color: #22c55e; } /* green-100, green-500 */
        .status-cancelled { background-color: #fee2e2; color: #ef4444; } /* red-100, red-500 */
    </style>
</head>
<body class="bg-gray-100">

    <header class="bg-blue-600 text-white shadow-md">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">RideCare Admin</h1>
            <nav>
                <a href="admin_dashboard" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-blue-700">Dashboard</a>
            </nav>
        </div>
    </header>

    <main class="container mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-3xl font-semibold text-gray-800">Manage Orders</h2>
            <button onclick="openCreateModal()" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg shadow focus:outline-none focus:shadow-outline transition duration-150 ease-in-out">
                Create New Order
            </button>
        </div>

        <div class="bg-white shadow-xl rounded-lg overflow-x-auto">
            <table class="min-w-full table-auto">
                <thead class="bg-gray-200 text-gray-700">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">ID</th>
                        <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">User ID</th>
                        <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Shop ID</th>
                        <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Service ID</th>
                        <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Status</th>
                        <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Order Date</th>
                        <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Scheduled</th>
                        <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Actions</th>
                    </tr>
                </thead>
                <tbody id="ordersTableBody" class="bg-white divide-y divide-gray-200 text-gray-700">
                    </tbody>
            </table>
        </div>
    </main>

    <div id="orderModal" class="modal">
        <div class="modal-content">
            <span class="close-button" onclick="closeModal()">&times;</span>
            <h3 id="modalTitle" class="text-2xl font-semibold mb-6 text-gray-800">Create Order</h3>
            <form id="orderForm">
                <input type="hidden" id="orderId" name="orderId">
                <div class="modal-body-scrollable pr-2">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <div>
                            <label for="orderUserId" class="block text-gray-700 text-sm font-bold mb-2">User ID:</label>
                            <input type="number" id="orderUserId" name="user_id" required class="shadow appearance-none border rounded-lg w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                        <div>
                            <label for="orderRepairShopId" class="block text-gray-700 text-sm font-bold mb-2">Repair Shop ID:</label>
                            <input type="number" id="orderRepairShopId" name="repair_shop_id" required class="shadow appearance-none border rounded-lg w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                    </div>
                     <div class="mb-4">
                        <label for="orderServiceId" class="block text-gray-700 text-sm font-bold mb-2">Service ID:</label>
                        <input type="number" id="orderServiceId" name="service_id" required class="shadow appearance-none border rounded-lg w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div class="mb-4">
                        <label for="orderStatus" class="block text-gray-700 text-sm font-bold mb-2">Status:</label>
                        <select id="orderStatus" name="status" required class="shadow appearance-none border rounded-lg w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="pending">Pending</option>
                            <option value="confirmed">Confirmed</option>
                            <option value="in_progress">In Progress</option>
                            <option value="completed">Completed</option>
                            <option value="cancelled">Cancelled</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label for="orderScheduledDate" class="block text-gray-700 text-sm font-bold mb-2">Scheduled Date:</label>
                        <input type="datetime-local" id="orderScheduledDate" name="scheduled_date" class="shadow appearance-none border rounded-lg w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div class="mb-4">
                        <label for="orderCompletedDate" class="block text-gray-700 text-sm font-bold mb-2">Completed Date:</label>
                        <input type="datetime-local" id="orderCompletedDate" name="completed_date" class="shadow appearance-none border rounded-lg w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                </div>
                <div class="flex items-center justify-end mt-6 pt-4 border-t">
                    <button type="button" onclick="closeModal()" class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-lg mr-2 focus:outline-none focus:shadow-outline transition duration-150 ease-in-out">
                        Cancel
                    </button>
                    <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg focus:outline-none focus:shadow-outline transition duration-150 ease-in-out">
                        Save Order
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="toast">
        <span id="toastMessage"></span>
    </div>

    <script>
        const API_BASE_URL = '/admin';
        const orderModal = document.getElementById('orderModal');
        const orderForm = document.getElementById('orderForm');
        const modalTitle = document.getElementById('modalTitle');
        const orderIdInput = document.getElementById('orderId');

        // Helper to format date for datetime-local input
        function toDatetimeLocal(isoString) {
            if (!isoString) return '';
            const date = new Date(isoString);
            // Adjust for local timezone
            const timezoneOffset = date.getTimezoneOffset() * 60000; //offset in milliseconds
            const localISOTime = (new Date(date.getTime() - timezoneOffset)).toISOString().slice(0, 16);
            return localISOTime;
        }

        // Helper to format date for API (ISO string)
        function toISOString(datetimeLocalString) {
            if (!datetimeLocalString) return null;
            return new Date(datetimeLocalString).toISOString();
        }


        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            toastMessage.textContent = message;
            toast.className = 'toast show' + (isError ? ' error' : '');
            setTimeout(() => {
                toast.className = toast.className.replace('show', '');
            }, 3000);
        }

        function openCreateModal() {
            orderForm.reset();
            orderIdInput.value = '';
            modalTitle.textContent = 'Create New Order';
            document.getElementById('orderStatus').value = "pending";
            document.getElementById('orderScheduledDate').value = '';
            document.getElementById('orderCompletedDate').value = '';
            orderModal.style.display = 'block';
        }

        async function openEditModal(id) {
            try {
                const response = await fetch(`${API_BASE_URL}/orders/${id}`);
                if (!response.ok) throw new Error(`Failed to fetch order: ${response.statusText}`);
                const order = await response.json();

                orderForm.reset();
                orderIdInput.value = order.id;
                document.getElementById('orderUserId').value = order.user_id;
                document.getElementById('orderRepairShopId').value = order.repair_shop_id;
                document.getElementById('orderServiceId').value = order.service_id;
                document.getElementById('orderStatus').value = order.status;
                document.getElementById('orderScheduledDate').value = toDatetimeLocal(order.scheduled_date);
                document.getElementById('orderCompletedDate').value = toDatetimeLocal(order.completed_date);
                
                modalTitle.textContent = 'Edit Order';
                orderModal.style.display = 'block';
            } catch (error) {
                console.error('Error opening edit modal:', error);
                showToast(`Error: ${error.message}`, true);
            }
        }

        function closeModal() {
            orderModal.style.display = 'none';
        }

        window.onclick = function(event) {
            if (event.target == orderModal) {
                closeModal();
            }
        }

        async function fetchOrders() {
            try {
                const response = await fetch(`${API_BASE_URL}/orders/`);
                if (!response.ok) throw new Error('Failed to fetch orders');
                const orders = await response.json();
                renderOrdersTable(orders);
            } catch (error) {
                console.error('Error fetching orders:', error);
                showToast(`Error fetching orders: ${error.message}`, true);
            }
        }
        
        function getStatusClass(status) {
            switch (status) {
                case 'pending': return 'status-pending';
                case 'confirmed': return 'status-confirmed';
                case 'in_progress': return 'status-in_progress';
                case 'completed': return 'status-completed';
                case 'cancelled': return 'status-cancelled';
                default: return 'bg-gray-200 text-gray-800';
            }
        }

        function renderOrdersTable(orders) {
            const tableBody = document.getElementById('ordersTableBody');
            tableBody.innerHTML = ''; 

            if (!orders || orders.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="8" class="text-center py-4">No orders found.</td></tr>';
                return;
            }

            orders.forEach(order => {
                const row = tableBody.insertRow();
                row.className = 'hover:bg-gray-50 transition duration-150 ease-in-out';
                const scheduledDateStr = order.scheduled_date ? new Date(order.scheduled_date).toLocaleDateString() : 'N/A';
                const orderDateStr = new Date(order.order_date).toLocaleDateString();
                
                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm">${order.id}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm">${order.user_id}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm">${order.repair_shop_id}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm">${order.service_id}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm">
                        <span class="status-badge ${getStatusClass(order.status)}">
                            ${order.status.replace('_', ' ')}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm">${orderDateStr}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm">${scheduledDateStr}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        <button onclick="openEditModal(${order.id})" class="text-indigo-600 hover:text-indigo-900 mr-3 transition duration-150 ease-in-out">Edit</button>
                        <button onclick="deleteOrder(${order.id})" class="text-red-600 hover:text-red-900 transition duration-150 ease-in-out">Delete</button>
                    </td>
                `;
            });
        }

        orderForm.addEventListener('submit', async function(event) {
            event.preventDefault();
            const formData = new FormData(orderForm);
            const id = formData.get('orderId');
            
            const data = {
                user_id: parseInt(formData.get('user_id')),
                repair_shop_id: parseInt(formData.get('repair_shop_id')),
                service_id: parseInt(formData.get('service_id')),
                status: formData.get('status'),
                scheduled_date: toISOString(formData.get('scheduled_date')),
                completed_date: toISOString(formData.get('completed_date'))
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_BASE_URL}/orders/${id}` : `${API_BASE_URL}/orders/`;

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || `Failed to ${id ? 'update' : 'create'} order`);
                }

                closeModal();
                fetchOrders(); 
                showToast(`Order ${id ? 'updated' : 'created'} successfully!`);
            } catch (error) {
                console.error(`Error ${id ? 'updating' : 'creating'} order:`, error);
                showToast(`Error: ${error.message}`, true);
            }
        });

        async function deleteOrder(id) {
            if (confirm('Are you sure you want to delete this order? This action cannot be undone.')) {
                try {
                    const response = await fetch(`${API_BASE_URL}/orders/${id}`, { method: 'DELETE' });
                     if (!response.ok) {
                         if (response.status === 204) { 
                            fetchOrders();
                            showToast('Order deleted successfully!');
                            return;
                        }
                        const errorData = await response.json().catch(() => null); 
                        throw new Error(errorData?.detail || `Failed to delete order. Status: ${response.status}`);
                    }
                    fetchOrders();
                    showToast('Order deleted successfully!');
                } catch (error) {
                    console.error('Error deleting order:', error);
                    showToast(`Error: ${error.message}`, true);
                }
            }
        }

        document.addEventListener('DOMContentLoaded', fetchOrders);
    </script>
</body>
</html>
