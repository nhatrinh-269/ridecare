<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Service Management — RideCare Admin</title>
  <link rel="stylesheet" href="../../css/styles.css">
</head>
<body class="full-screen">
  <div class="main-container">
    <h2 class="content">Services</h2>
    <table id="servicesTable" class="content"></table>
  </div>

  <script src="../../js/auth.js"></script>
  <script src="../../js/admin.js"></script>
  <script>
    async function loadServices() {
      const services = await fetchAllServices();
      const table = document.getElementById('servicesTable');
      table.innerHTML = '<tr><th>ID</th><th>Name</th><th>Action</th></tr>';
      services.forEach(s => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${s.id}</td>
          <td>${s.name}</td>
          <td><button onclick="deleteService(${s.id}).then(loadServices)">Delete</button></td>
        `;
        table.appendChild(row);
      });
    }
    loadServices();
  </script>
</body>
</html>
