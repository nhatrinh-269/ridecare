<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Services - RideCare Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Tailwind gray-100 */
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 50;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
        }
        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 24px;
            border: 1px solid #888;
            width: 80%;
            max-width: 600px;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .close-button {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        .close-button:hover,
        .close-button:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
        .table th, .table td {
            padding: 0.75rem;
            vertical-align: middle;
        }
        .table th {
            background-color: #e5e7eb;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #10b981;
            color: white;
            padding: 1rem;
            border-radius: 0.375rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            z-index: 100;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        .toast.show {
            opacity: 1;
        }
        .toast.error {
            background-color: #ef4444;
        }
        .modal-body-scrollable {
            max-height: 60vh;
            overflow-y: auto;
        }
    </style>
</head>
<body class="bg-gray-100">

    <header class="bg-blue-600 text-white shadow-md">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">RideCare Admin</h1>
            <nav>
                <a href="admin_dashboard" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-blue-700">Dashboard</a>
                </nav>
        </div>
    </header>

    <main class="container mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-3xl font-semibold text-gray-800">Manage Services</h2>
            <button onclick="openCreateModal()" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg shadow focus:outline-none focus:shadow-outline transition duration-150 ease-in-out">
                Create New Service
            </button>
        </div>

        <div class="bg-white shadow-xl rounded-lg overflow-x-auto">
            <table class="min-w-full table-auto">
                <thead class="bg-gray-200 text-gray-700">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">ID</th>
                        <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Name</th>
                        <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Shop ID</th>
                        <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Price</th>
                        <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Duration (min)</th>
                        <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Available</th>
                        <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Actions</th>
                    </tr>
                </thead>
                <tbody id="servicesTableBody" class="bg-white divide-y divide-gray-200 text-gray-700">
                    </tbody>
            </table>
        </div>
    </main>

    <div id="serviceModal" class="modal">
        <div class="modal-content">
            <span class="close-button" onclick="closeModal()">&times;</span>
            <h3 id="modalTitle" class="text-2xl font-semibold mb-6 text-gray-800">Create Service</h3>
            <form id="serviceForm">
                <input type="hidden" id="serviceId" name="serviceId">
                <div class="modal-body-scrollable pr-2">
                    <div class="mb-4">
                        <label for="serviceName" class="block text-gray-700 text-sm font-bold mb-2">Service Name:</label>
                        <input type="text" id="serviceName" name="name" required class="shadow appearance-none border rounded-lg w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div class="mb-4">
                        <label for="serviceRepairShopId" class="block text-gray-700 text-sm font-bold mb-2">Repair Shop ID:</label>
                        <input type="number" id="serviceRepairShopId" name="repair_shop_id" required class="shadow appearance-none border rounded-lg w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div class="mb-4">
                        <label for="serviceDescription" class="block text-gray-700 text-sm font-bold mb-2">Description:</label>
                        <textarea id="serviceDescription" name="description" rows="3" class="shadow appearance-none border rounded-lg w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <div>
                            <label for="servicePrice" class="block text-gray-700 text-sm font-bold mb-2">Price:</label>
                            <input type="number" step="0.01" id="servicePrice" name="price" required class="shadow appearance-none border rounded-lg w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                        <div>
                            <label for="serviceDuration" class="block text-gray-700 text-sm font-bold mb-2">Duration (minutes):</label>
                            <input type="number" id="serviceDuration" name="duration" required class="shadow appearance-none border rounded-lg w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                    </div>
                    <div class="mb-6">
                        <label for="serviceIsAvailable" class="block text-gray-700 text-sm font-bold mb-2">Is Available:</label>
                        <select id="serviceIsAvailable" name="is_available" class="shadow appearance-none border rounded-lg w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="true">Yes</option>
                            <option value="false">No</option>
                        </select>
                    </div>
                </div>
                <div class="flex items-center justify-end mt-6 pt-4 border-t">
                    <button type="button" onclick="closeModal()" class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-lg mr-2 focus:outline-none focus:shadow-outline transition duration-150 ease-in-out">
                        Cancel
                    </button>
                    <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg focus:outline-none focus:shadow-outline transition duration-150 ease-in-out">
                        Save Service
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="toast">
        <span id="toastMessage"></span>
    </div>

    <script>
        const API_BASE_URL = '/admin'; // Adjust if your API prefix is different
        const serviceModal = document.getElementById('serviceModal');
        const serviceForm = document.getElementById('serviceForm');
        const modalTitle = document.getElementById('modalTitle');
        const serviceIdInput = document.getElementById('serviceId');

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            toastMessage.textContent = message;
            toast.className = 'toast show' + (isError ? ' error' : '');
            setTimeout(() => {
                toast.className = toast.className.replace('show', '');
            }, 3000);
        }

        function openCreateModal() {
            serviceForm.reset();
            serviceIdInput.value = '';
            modalTitle.textContent = 'Create New Service';
            document.getElementById('serviceIsAvailable').value = "true"; // Default to available
            serviceModal.style.display = 'block';
        }

        async function openEditModal(id) {
            try {
                const response = await fetch(`${API_BASE_URL}/services/${id}`);
                if (!response.ok) throw new Error(`Failed to fetch service: ${response.statusText}`);
                const service = await response.json();

                serviceForm.reset();
                serviceIdInput.value = service.id;
                document.getElementById('serviceName').value = service.name;
                document.getElementById('serviceRepairShopId').value = service.repair_shop_id;
                document.getElementById('serviceDescription').value = service.description || '';
                document.getElementById('servicePrice').value = service.price;
                document.getElementById('serviceDuration').value = service.duration;
                document.getElementById('serviceIsAvailable').value = String(service.is_available);

                modalTitle.textContent = 'Edit Service';
                serviceModal.style.display = 'block';
            } catch (error) {
                console.error('Error opening edit modal:', error);
                showToast(`Error: ${error.message}`, true);
            }
        }

        function closeModal() {
            serviceModal.style.display = 'none';
        }

        window.onclick = function(event) {
            if (event.target == serviceModal) {
                closeModal();
            }
        }

        async function fetchServices() {
            try {
                const response = await fetch(`${API_BASE_URL}/services/`);
                if (!response.ok) throw new Error('Failed to fetch services');
                const services = await response.json();
                renderServicesTable(services);
            } catch (error) {
                console.error('Error fetching services:', error);
                showToast(`Error fetching services: ${error.message}`, true);
            }
        }

        function renderServicesTable(services) {
            const tableBody = document.getElementById('servicesTableBody');
            tableBody.innerHTML = ''; 

            if (!services || services.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="7" class="text-center py-4">No services found.</td></tr>';
                return;
            }

            services.forEach(service => {
                const row = tableBody.insertRow();
                row.className = 'hover:bg-gray-50 transition duration-150 ease-in-out';
                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm">${service.id}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm">${service.name}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm">${service.repair_shop_id}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm">${parseFloat(service.price).toFixed(2)}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm">${service.duration}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm">
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${service.is_available ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                            ${service.is_available ? 'Yes' : 'No'}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        <button onclick="openEditModal(${service.id})" class="text-indigo-600 hover:text-indigo-900 mr-3 transition duration-150 ease-in-out">Edit</button>
                        <button onclick="deleteService(${service.id})" class="text-red-600 hover:text-red-900 transition duration-150 ease-in-out">Delete</button>
                    </td>
                `;
            });
        }

        serviceForm.addEventListener('submit', async function(event) {
            event.preventDefault();
            const formData = new FormData(serviceForm);
            const id = formData.get('serviceId');
            
            const data = {
                name: formData.get('name'),
                repair_shop_id: parseInt(formData.get('repair_shop_id')),
                description: formData.get('description') || null,
                price: parseFloat(formData.get('price')),
                duration: parseInt(formData.get('duration')),
                is_available: formData.get('is_available') === 'true'
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_BASE_URL}/services/${id}` : `${API_BASE_URL}/services/`;

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || `Failed to ${id ? 'update' : 'create'} service`);
                }

                closeModal();
                fetchServices(); 
                showToast(`Service ${id ? 'updated' : 'created'} successfully!`);
            } catch (error) {
                console.error(`Error ${id ? 'updating' : 'creating'} service:`, error);
                showToast(`Error: ${error.message}`, true);
            }
        });

        async function deleteService(id) {
            if (confirm('Are you sure you want to delete this service? This might affect existing orders.')) {
                try {
                    const response = await fetch(`${API_BASE_URL}/services/${id}`, { method: 'DELETE' });
                     if (!response.ok) {
                         if (response.status === 204) { 
                            fetchServices();
                            showToast('Service deleted successfully!');
                            return;
                        }
                        const errorData = await response.json().catch(() => null); 
                        throw new Error(errorData?.detail || `Failed to delete service. Status: ${response.status}`);
                    }
                    fetchServices();
                    showToast('Service deleted successfully!');
                } catch (error) {
                    console.error('Error deleting service:', error);
                    showToast(`Error: ${error.message}`, true);
                }
            }
        }

        document.addEventListener('DOMContentLoaded', fetchServices);
    </script>
</body>
</html>
