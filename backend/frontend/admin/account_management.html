<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Users - RideCare Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Tailwind gray-100 */
        }
        .modal {
            display: none; /* Hidden by default */
            position: fixed; /* Stay in place */
            z-index: 50; /* Sit on top */
            left: 0;
            top: 0;
            width: 100%; /* Full width */
            height: 100%; /* Full height */
            overflow: auto; /* Enable scroll if needed */
            background-color: rgba(0,0,0,0.4); /* Black w/ opacity */
        }
        .modal-content {
            background-color: #fefefe;
            margin: 10% auto; /* 10% from the top and centered */
            padding: 24px;
            border: 1px solid #888;
            width: 80%; /* Could be more or less, depending on screen size */
            max-width: 500px; /* Maximum width */
            border-radius: 0.5rem; /* Tailwind rounded-lg */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .close-button {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        .close-button:hover,
        .close-button:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
        .table th, .table td {
            padding: 0.75rem; /* Tailwind p-3 */
            vertical-align: middle;
        }
        .table th {
            background-color: #e5e7eb; /* Tailwind gray-200 */
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #10b981; /* Tailwind green-500 */
            color: white;
            padding: 1rem;
            border-radius: 0.375rem; /* Tailwind rounded-md */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            z-index: 100;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        .toast.show {
            opacity: 1;
        }
        .toast.error {
            background-color: #ef4444; /* Tailwind red-500 */
        }
    </style>
</head>
<body class="bg-gray-100">

    <header class="bg-blue-600 text-white shadow-md">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">RideCare Admin</h1>
            <nav>
                <a href="admin_dashboard" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-blue-700">Dashboard</a>
                </nav>
        </div>
    </header>

    <main class="container mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-3xl font-semibold text-gray-800">Manage Users</h2>
            <button onclick="openCreateModal()" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg shadow focus:outline-none focus:shadow-outline transition duration-150 ease-in-out">
                Create New User
            </button>
        </div>

        <div class="bg-white shadow-xl rounded-lg overflow-x-auto">
            <table class="min-w-full table-auto">
                <thead class="bg-gray-200 text-gray-700">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">ID</th>
                        <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Username</th>
                        <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Email</th>
                        <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Role</th>
                        <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Created At</th>
                        <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Actions</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody" class="bg-white divide-y divide-gray-200 text-gray-700">
                    </tbody>
            </table>
        </div>
    </main>

    <div id="userModal" class="modal">
        <div class="modal-content">
            <span class="close-button" onclick="closeModal()">&times;</span>
            <h3 id="modalTitle" class="text-2xl font-semibold mb-6 text-gray-800">Create User</h3>
            <form id="userForm">
                <input type="hidden" id="userId" name="userId">

                <div class="mb-4">
                    <label for="username" class="block text-gray-700 text-sm font-bold mb-2">Username:</label>
                    <input type="text" id="username" name="username" required class="shadow appearance-none border rounded-lg w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div class="mb-4">
                    <label for="email" class="block text-gray-700 text-sm font-bold mb-2">Email:</label>
                    <input type="email" id="email" name="email" required class="shadow appearance-none border rounded-lg w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div class="mb-4" id="passwordField">
                    <label for="password" class="block text-gray-700 text-sm font-bold mb-2">Password:</label>
                    <input type="password" id="password" name="password" class="shadow appearance-none border rounded-lg w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    <p class="text-xs text-gray-500 mt-1">Required for new users. Leave blank if not changing for existing user.</p>
                </div>
                <div class="mb-6">
                    <label for="role" class="block text-gray-700 text-sm font-bold mb-2">Role:</label>
                    <select id="role" name="role" required class="shadow appearance-none border rounded-lg w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="user">User</option>
                        <option value="repair_shop">Repair Shop</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <div class="flex items-center justify-end">
                    <button type="button" onclick="closeModal()" class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-lg mr-2 focus:outline-none focus:shadow-outline transition duration-150 ease-in-out">
                        Cancel
                    </button>
                    <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg focus:outline-none focus:shadow-outline transition duration-150 ease-in-out">
                        Save User
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="toast">
        <span id="toastMessage"></span>
    </div>

    <script>
        const API_BASE_URL = '/admin'; // Adjust if your API prefix is different
        const userModal = document.getElementById('userModal');
        const userForm = document.getElementById('userForm');
        const modalTitle = document.getElementById('modalTitle');
        const userIdInput = document.getElementById('userId');
        const passwordField = document.getElementById('passwordField');
        const passwordInput = document.getElementById('password');

        // --- Toast Notification ---
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            toastMessage.textContent = message;
            toast.className = 'toast show' + (isError ? ' error' : '');
            setTimeout(() => {
                toast.className = toast.className.replace('show', '');
            }, 3000);
        }

        // --- Modal Control ---
        function openCreateModal() {
            userForm.reset();
            userIdInput.value = '';
            modalTitle.textContent = 'Create New User';
            passwordField.style.display = 'block';
            passwordInput.required = true;
            userModal.style.display = 'block';
        }

        async function openEditModal(id) {
            try {
                const response = await fetch(`${API_BASE_URL}/users/${id}`);
                if (!response.ok) throw new Error(`Failed to fetch user: ${response.statusText}`);
                const user = await response.json();

                userForm.reset();
                userIdInput.value = user.id;
                document.getElementById('username').value = user.username;
                document.getElementById('email').value = user.email;
                document.getElementById('role').value = user.role;

                modalTitle.textContent = 'Edit User';
                passwordField.style.display = 'block'; // Or hide if admin cannot change passwords easily
                passwordInput.required = false; // Password not required for update unless changing
                userModal.style.display = 'block';
            } catch (error) {
                console.error('Error opening edit modal:', error);
                showToast(`Error: ${error.message}`, true);
            }
        }

        function closeModal() {
            userModal.style.display = 'none';
        }

        window.onclick = function(event) {
            if (event.target == userModal) {
                closeModal();
            }
        }

        // --- API Calls ---
        async function fetchUsers() {
            try {
                const response = await fetch(`${API_BASE_URL}/users/`);
                if (!response.ok) throw new Error('Failed to fetch users');
                const users = await response.json();
                renderUsersTable(users);
            } catch (error) {
                console.error('Error fetching users:', error);
                showToast(`Error fetching users: ${error.message}`, true);
            }
        }

        function renderUsersTable(users) {
            const tableBody = document.getElementById('usersTableBody');
            tableBody.innerHTML = ''; // Clear existing rows

            if (!users || users.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="6" class="text-center py-4">No users found.</td></tr>';
                return;
            }

            users.forEach(user => {
                const row = tableBody.insertRow();
                row.className = 'hover:bg-gray-50 transition duration-150 ease-in-out';
                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm">${user.id}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm">${user.username}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm">${user.email}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm">${user.role}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm">${new Date(user.created_at).toLocaleDateString()}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        <button onclick="openEditModal(${user.id})" class="text-indigo-600 hover:text-indigo-900 mr-3 transition duration-150 ease-in-out">Edit</button>
                        <button onclick="deleteUser(${user.id})" class="text-red-600 hover:text-red-900 transition duration-150 ease-in-out">Delete</button>
                    </td>
                `;
            });
        }

        userForm.addEventListener('submit', async function(event) {
            event.preventDefault();
            const formData = new FormData(userForm);
            const id = formData.get('userId');
            const data = {
                username: formData.get('username'),
                email: formData.get('email'),
                role: formData.get('role'),
            };

            if (id) { // Update existing user
                if (formData.get('password')) { // Only include password if provided for update
                    data.password = formData.get('password');
                }
            } else { // Create new user
                data.password = formData.get('password');
                if (!data.password) {
                    showToast('Password is required for new users.', true);
                    return;
                }
            }


            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_BASE_URL}/users/${id}` : `${API_BASE_URL}/users/`;

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || `Failed to ${id ? 'update' : 'create'} user`);
                }

                closeModal();
                fetchUsers(); // Refresh the table
                showToast(`User ${id ? 'updated' : 'created'} successfully!`);
            } catch (error) {
                console.error(`Error ${id ? 'updating' : 'creating'} user:`, error);
                showToast(`Error: ${error.message}`, true);
            }
        });

        async function deleteUser(id) {
            // Replace with a custom modal confirmation later
            if (confirm('Are you sure you want to delete this user? This action cannot be undone.')) {
                try {
                    const response = await fetch(`${API_BASE_URL}/users/${id}`, { method: 'DELETE' });
                    if (!response.ok) {
                         if (response.status === 204) { // No content, successful delete
                            fetchUsers();
                            showToast('User deleted successfully!');
                            return;
                        }
                        const errorData = await response.json().catch(() => null); // Try to parse error, otherwise null
                        throw new Error(errorData?.detail || `Failed to delete user. Status: ${response.status}`);
                    }
                    // For 204 No Content, response.json() will fail.
                    // Check for status 204 explicitly if backend returns it for successful DELETE.
                    fetchUsers(); // Refresh the table
                    showToast('User deleted successfully!');
                } catch (error) {
                    console.error('Error deleting user:', error);
                    showToast(`Error: ${error.message}`, true);
                }
            }
        }

        // --- Initial Load ---
        document.addEventListener('DOMContentLoaded', fetchUsers);
    </script>
</body>
</html>
