<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Repair Shop Management — RideCare Admin</title>
  <link rel="stylesheet" href="../../css/styles.css">
</head>
<body class="full-screen">
  <div class="main-container">
    <h2 class="content">Repair Shops</h2>
    <table id="shopsTable" class="content"></table>
  </div>

  <script src="../../js/auth.js"></script>
  <script src="../../js/admin.js"></script>
  <script>
    async function loadShops() {
      const shops = await fetchAllRepairShops();
      const table = document.getElementById('shopsTable');
      table.innerHTML = '<tr><th>ID</th><th>Name</th><th>Action</th></tr>';
      shops.forEach(s => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${s.id}</td>
          <td>${s.name}</td>
          <td><button onclick="deleteRepairShop(${s.id}).then(loadShops)">Delete</button></td>
        `;
        table.appendChild(row);
      });
    }
    loadShops();
  </script>
</body>
</html>
