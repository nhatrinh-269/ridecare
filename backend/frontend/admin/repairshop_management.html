<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Repair Shops - RideCare Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Tailwind gray-100 */
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 50;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
        }
        .modal-content {
            background-color: #fefefe;
            margin: 5% auto; /* Adjusted margin for potentially taller modal */
            padding: 24px;
            border: 1px solid #888;
            width: 80%;
            max-width: 600px; /* Increased max-width for more fields */
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .close-button {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        .close-button:hover,
        .close-button:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
        .table th, .table td {
            padding: 0.75rem;
            vertical-align: middle;
        }
        .table th {
            background-color: #e5e7eb;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #10b981;
            color: white;
            padding: 1rem;
            border-radius: 0.375rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            z-index: 100;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        .toast.show {
            opacity: 1;
        }
        .toast.error {
            background-color: #ef4444;
        }
        /* Custom scrollbar for modal content if it overflows */
        .modal-body-scrollable {
            max-height: 60vh; /* Adjust as needed */
            overflow-y: auto;
        }
    </style>
</head>
<body class="bg-gray-100">

    <header class="bg-blue-600 text-white shadow-md">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">RideCare Admin</h1>
            <nav>
                <a href="admin_dashboard" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-blue-700">Dashboard</a>
                </nav>
        </div>
    </header>

    <main class="container mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-3xl font-semibold text-gray-800">Manage Repair Shops</h2>
            <button onclick="openCreateModal()" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg shadow focus:outline-none focus:shadow-outline transition duration-150 ease-in-out">
                Create New Shop
            </button>
        </div>

        <div class="bg-white shadow-xl rounded-lg overflow-x-auto">
            <table class="min-w-full table-auto">
                <thead class="bg-gray-200 text-gray-700">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">ID</th>
                        <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Name</th>
                        <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Owner ID</th>
                        <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Phone</th>
                        <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Approved</th>
                        <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Rating</th>
                        <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Actions</th>
                    </tr>
                </thead>
                <tbody id="shopsTableBody" class="bg-white divide-y divide-gray-200 text-gray-700">
                    </tbody>
            </table>
        </div>
    </main>

    <div id="shopModal" class="modal">
        <div class="modal-content">
            <span class="close-button" onclick="closeModal()">&times;</span>
            <h3 id="modalTitle" class="text-2xl font-semibold mb-6 text-gray-800">Create Repair Shop</h3>
            <form id="shopForm">
                <input type="hidden" id="shopId" name="shopId">
                <div class="modal-body-scrollable pr-2"> <div class="mb-4">
                        <label for="shopName" class="block text-gray-700 text-sm font-bold mb-2">Shop Name:</label>
                        <input type="text" id="shopName" name="name" required class="shadow appearance-none border rounded-lg w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div class="mb-4">
                        <label for="shopOwnerId" class="block text-gray-700 text-sm font-bold mb-2">Owner User ID:</label>
                        <input type="number" id="shopOwnerId" name="user_id" required class="shadow appearance-none border rounded-lg w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div class="mb-4">
                        <label for="shopAddress" class="block text-gray-700 text-sm font-bold mb-2">Address:</label>
                        <input type="text" id="shopAddress" name="address" required class="shadow appearance-none border rounded-lg w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div class="mb-4">
                        <label for="shopPhone" class="block text-gray-700 text-sm font-bold mb-2">Phone:</label>
                        <input type="tel" id="shopPhone" name="phone" required class="shadow appearance-none border rounded-lg w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div class="mb-4">
                        <label for="shopDescription" class="block text-gray-700 text-sm font-bold mb-2">Description:</label>
                        <textarea id="shopDescription" name="description" rows="3" class="shadow appearance-none border rounded-lg w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <div>
                            <label for="shopLatitude" class="block text-gray-700 text-sm font-bold mb-2">Latitude:</label>
                            <input type="number" step="any" id="shopLatitude" name="latitude" class="shadow appearance-none border rounded-lg w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                        <div>
                            <label for="shopLongitude" class="block text-gray-700 text-sm font-bold mb-2">Longitude:</label>
                            <input type="number" step="any" id="shopLongitude" name="longitude" class="shadow appearance-none border rounded-lg w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                    </div>
                    <div class="mb-6">
                        <label for="shopApproved" class="block text-gray-700 text-sm font-bold mb-2">Approved:</label>
                        <select id="shopApproved" name="approved" class="shadow appearance-none border rounded-lg w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="false">No</option>
                            <option value="true">Yes</option>
                        </select>
                    </div>
                </div>
                <div class="flex items-center justify-end mt-6 pt-4 border-t">
                    <button type="button" onclick="closeModal()" class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-lg mr-2 focus:outline-none focus:shadow-outline transition duration-150 ease-in-out">
                        Cancel
                    </button>
                    <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg focus:outline-none focus:shadow-outline transition duration-150 ease-in-out">
                        Save Shop
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="toast">
        <span id="toastMessage"></span>
    </div>

    <script>
        const API_BASE_URL = '/admin'; // Adjust if your API prefix is different
        const shopModal = document.getElementById('shopModal');
        const shopForm = document.getElementById('shopForm');
        const modalTitle = document.getElementById('modalTitle');
        const shopIdInput = document.getElementById('shopId');

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            toastMessage.textContent = message;
            toast.className = 'toast show' + (isError ? ' error' : '');
            setTimeout(() => {
                toast.className = toast.className.replace('show', '');
            }, 3000);
        }

        function openCreateModal() {
            shopForm.reset();
            shopIdInput.value = '';
            modalTitle.textContent = 'Create New Repair Shop';
            document.getElementById('shopApproved').value = "false"; // Default to not approved
            shopModal.style.display = 'block';
        }

        async function openEditModal(id) {
            try {
                const response = await fetch(`${API_BASE_URL}/repair-shops/${id}`);
                if (!response.ok) throw new Error(`Failed to fetch shop: ${response.statusText}`);
                const shop = await response.json();

                shopForm.reset();
                shopIdInput.value = shop.id;
                document.getElementById('shopName').value = shop.name;
                document.getElementById('shopOwnerId').value = shop.user_id;
                document.getElementById('shopAddress').value = shop.address;
                document.getElementById('shopPhone').value = shop.phone;
                document.getElementById('shopDescription').value = shop.description || '';
                document.getElementById('shopLatitude').value = shop.latitude || '';
                document.getElementById('shopLongitude').value = shop.longitude || '';
                document.getElementById('shopApproved').value = String(shop.approved);

                modalTitle.textContent = 'Edit Repair Shop';
                shopModal.style.display = 'block';
            } catch (error) {
                console.error('Error opening edit modal:', error);
                showToast(`Error: ${error.message}`, true);
            }
        }

        function closeModal() {
            shopModal.style.display = 'none';
        }

        window.onclick = function(event) {
            if (event.target == shopModal) {
                closeModal();
            }
        }

        async function fetchShops() {
            try {
                const response = await fetch(`${API_BASE_URL}/repair-shops/`);
                if (!response.ok) throw new Error('Failed to fetch repair shops');
                const shops = await response.json();
                renderShopsTable(shops);
            } catch (error) {
                console.error('Error fetching shops:', error);
                showToast(`Error fetching shops: ${error.message}`, true);
            }
        }

        function renderShopsTable(shops) {
            const tableBody = document.getElementById('shopsTableBody');
            tableBody.innerHTML = ''; 

            if (!shops || shops.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="7" class="text-center py-4">No repair shops found.</td></tr>';
                return;
            }

            shops.forEach(shop => {
                const row = tableBody.insertRow();
                row.className = 'hover:bg-gray-50 transition duration-150 ease-in-out';
                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm">${shop.id}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm">${shop.name}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm">${shop.user_id}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm">${shop.phone}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm">
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${shop.approved ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                            ${shop.approved ? 'Yes' : 'No'}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm">${shop.rating_avg.toFixed(1)}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        <button onclick="openEditModal(${shop.id})" class="text-indigo-600 hover:text-indigo-900 mr-3 transition duration-150 ease-in-out">Edit</button>
                        <button onclick="deleteShop(${shop.id})" class="text-red-600 hover:text-red-900 transition duration-150 ease-in-out">Delete</button>
                    </td>
                `;
            });
        }

        shopForm.addEventListener('submit', async function(event) {
            event.preventDefault();
            const formData = new FormData(shopForm);
            const id = formData.get('shopId');
            
            const data = {
                name: formData.get('name'),
                user_id: parseInt(formData.get('user_id')),
                address: formData.get('address'),
                phone: formData.get('phone'),
                description: formData.get('description') || null,
                latitude: formData.get('latitude') ? parseFloat(formData.get('latitude')) : null,
                longitude: formData.get('longitude') ? parseFloat(formData.get('longitude')) : null,
                approved: formData.get('approved') === 'true' // Convert string "true"/"false" to boolean
            };
             // Remove null fields for PATCH-like behavior if API supports it, or ensure API handles nulls for optional fields
            for (const key in data) {
                if (data[key] === null && (key === 'description' || key === 'latitude' || key === 'longitude')) {
                    // For PUT, we usually send all fields. If your backend expects optional fields to be absent if not set,
                    // you might need to delete them from the 'data' object here.
                    // However, for simplicity, we'll send them as null if empty and let the backend handle it.
                }
            }


            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_BASE_URL}/repair-shops/${id}` : `${API_BASE_URL}/repair-shops/`;

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || `Failed to ${id ? 'update' : 'create'} shop`);
                }

                closeModal();
                fetchShops(); 
                showToast(`Repair shop ${id ? 'updated' : 'created'} successfully!`);
            } catch (error) {
                console.error(`Error ${id ? 'updating' : 'creating'} shop:`, error);
                showToast(`Error: ${error.message}`, true);
            }
        });

        async function deleteShop(id) {
            if (confirm('Are you sure you want to delete this repair shop? This may also affect related services, orders, and reviews.')) {
                try {
                    const response = await fetch(`${API_BASE_URL}/repair-shops/${id}`, { method: 'DELETE' });
                     if (!response.ok) {
                         if (response.status === 204) { 
                            fetchShops();
                            showToast('Repair shop deleted successfully!');
                            return;
                        }
                        const errorData = await response.json().catch(() => null); 
                        throw new Error(errorData?.detail || `Failed to delete shop. Status: ${response.status}`);
                    }
                    fetchShops();
                    showToast('Repair shop deleted successfully!');
                } catch (error) {
                    console.error('Error deleting shop:', error);
                    showToast(`Error: ${error.message}`, true);
                }
            }
        }

        document.addEventListener('DOMContentLoaded', fetchShops);
    </script>
</body>
</html>
